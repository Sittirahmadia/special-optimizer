name: Build Cyber Beast Optimizer

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle Distribution
      run: |
        # Download gradle distribution to GRADLE_HOME
        mkdir -p $HOME/.gradle/wrapper/dists
        cd $HOME/.gradle/wrapper/dists
        
        echo "Downloading Gradle 8.9..."
        curl -L -o gradle-8.9-bin.zip "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
        unzip -q gradle-8.9-bin.zip
        
        # Set GRADLE_HOME
        echo "GRADLE_HOME=$HOME/.gradle/wrapper/dists/gradle-8.9" >> $GITHUB_ENV
        echo "PATH=$HOME/.gradle/wrapper/dists/gradle-8.9/bin:$PATH" >> $GITHUB_ENV
        
        # Verify gradle installation
        $HOME/.gradle/wrapper/dists/gradle-8.9/bin/gradle --version
        echo "Gradle setup complete"

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
        cat local.properties

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: $GRADLE_HOME/bin/gradle assembleDebug --no-daemon
      continue-on-error: true

    - name: Build Release APK
      run: $GRADLE_HOME/bin/gradle assembleRelease --no-daemon
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon
      continue-on-error: true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 7

    - name: Build Status Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Workflow Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build artifacts available in Actions" >> $GITHUB_STEP_SUMMARY
