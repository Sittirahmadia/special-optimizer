name: Build Cyber Beast Optimizer

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        # Download gradle distribution
        curl -L -o /tmp/gradle-8.9-bin.zip \
          "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
        # Extract wrapper jar from distribution
        unzip -j /tmp/gradle-8.9-bin.zip "gradle-8.9/lib/gradle-wrapper.jar" \
          -d gradle/wrapper/
        rm /tmp/gradle-8.9-bin.zip
        # Verify
        ls -lh gradle/wrapper/gradle-wrapper.jar
        file gradle/wrapper/gradle-wrapper.jar

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Validate Gradle Wrapper
      run: ./gradlew --version

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -x lintVitalRelease
      continue-on-error: true

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon -x lintVitalRelease
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon -x lintVitalRelease
      continue-on-error: true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 7

    - name: Build Status Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Workflow Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Artifacts uploaded if build succeeded" >> $GITHUB_STEP_SUMMARY
