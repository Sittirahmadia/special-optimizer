name: Build Cyber Beast Optimizer

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Gradle Wrapper Dependencies
      run: |
        mkdir -p gradle/wrapper
        # Download gradle distribution and extract all required lib jars
        cd /tmp
        curl -L -o gradle-8.9-bin.zip "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
        unzip -q gradle-8.9-bin.zip
        
        # Copy wrapper jar and its dependencies
        cp gradle-8.9/lib/gradle-wrapper-shared-8.9.jar "${{ github.workspace }}/gradle/wrapper/"
        cp gradle-8.9/lib/plugins/gradle-wrapper-main-8.9.jar "${{ github.workspace }}/gradle/wrapper/"
        
        # Create a wrapper jar that includes all dependencies
        cd "${{ github.workspace }}/gradle/wrapper"
        jar xf gradle-wrapper-shared-8.9.jar
        jar xf gradle-wrapper-main-8.9.jar
        jar cf gradle-wrapper.jar org/ META-INF/
        
        rm -f gradle-wrapper-shared-8.9.jar gradle-wrapper-main-8.9.jar
        ls -lh gradle-wrapper.jar

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      continue-on-error: true

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: CyberBeast-Optimizer-Release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon
      continue-on-error: true

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: app/build/reports/tests/
        retention-days: 7

    - name: Build Status Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Workflow Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build artifacts available in Actions" >> $GITHUB_STEP_SUMMARY
